[project]
name = "vmd-backend-interview"
version = "0.1.0"
description = ""
authors = [
    {name = "Hannah Stoebel",email = "hstoebel@villagemd.com"}
]
readme = "README.md"
requires-python = "~3.12"
dependencies = [
    "fastapi (>=0.117.1,<0.118.0)",
    "sqlmodel (>=0.0.25,<0.0.26)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
httpx = "^0.28.1"
pytest-asyncio = "^1.2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"